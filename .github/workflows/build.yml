name: Build and Push Image

on:
  push:
    branches:
      - trunk
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read OPENCLAW_VERSION from Dockerfile
        id: version
        run: |
          OPENCLAW_VERSION="$(grep -oP '^ARG OPENCLAW_VERSION=\K.*' Dockerfile)"
          if [ -z "$OPENCLAW_VERSION" ]; then
            echo "Could not read OPENCLAW_VERSION from Dockerfile" >&2
            exit 1
          fi
          echo "openclaw_version=$OPENCLAW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved OPENCLAW_VERSION=$OPENCLAW_VERSION"

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            OPENCLAW_VERSION=${{ steps.version.outputs.openclaw_version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.openclaw_version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
